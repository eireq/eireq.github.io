<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script>
        const path = window.location.pathname
        const query = window.location.search
        const hash = window.location.hash

        sessionStorage.redirect =
            path + query + hash

        window.location.replace('/')
    </script>
</head>
<body>
</body>
</html>
