<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eire</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 30px;
            background: #000;
            border-bottom: 1px solid #222;
        }

        .logo {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 20px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .nav-links a {
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #fff;
        }

        .socials {
            display: flex;
            gap: 12px;
        }

        .socials a {
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
        }

        .socials a:hover {
            color: #fff;
        }

        .language {
            color: #aaa;
            background: #000;
            border: 1px solid #333;
            padding: 6px 8px;
            border-radius: 4px;
        }

        main {
            min-height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 30px;
        }

        .hero {
            width: 100%;
            max-width: 900px;
        }

        h1 {
            font-size: clamp(55px, 10vw, 110px);
            line-height: 0.95;
            margin: 0 0 35px;
            letter-spacing: -5px;
        }

        .button {
            display: inline-block;
            padding: 12px 20px;
            border: 1px solid #fff;
            color: #fff;
            text-decoration: none;
            font-size: 15px;
            transition: 0.2s;
        }

        .button:hover {
            background: #fff;
            color: #000;
        }

        footer {
            border-top: 1px solid #222;
            padding: 35px 30px;
            color: #777;
            font-size: 14px;
        }

        footer a {
            color: #aaa;
        }

        @media (max-width: 800px) {
            nav {
                flex-wrap: wrap;
                gap: 15px;
            }

            .nav-links {
                order: 3;
                width: 100%;
                overflow-x: auto;
            }

            .socials {
                margin-left: auto;
            }
        }
    </style>
</head>

<body>

<nav>
    <a class="logo" href="index.html">eire</a>

    <div class="nav-links">
        <a href="https://eireq.github.io/me">intro</a>
        <a href="https://eireq.github.io/rc">random country</a>
        <a href="https://eireq.github.io/modes">modes.</a>
        <a href="https://eireq.github.io/racing">racing game (soon)</a>
        <a href="https://eireq.github.io/fq">flag quiz (soon)</a>
        <a href="https://eireq.github.io/gravity">gravity simulator (soon)</a>
        <a href="https://eireq.github.io/jworld">jWorld (soon)</a>
    </div>

    <div class="socials">
        <a href="https://github.com/eireq" target="_blank">github</a>
        <a href="https://discord.gg/zwvvbqBFPV" target="_blank">discord</a>
        <a href="https://www.youtube.com/@%E3%81%84%E4%B8%A8" target="_blank">youtube</a>

        <select class="language">
            <option>en</option>
            <option>sk</option>
        </select>
    </div>
</nav>

<main>
    <section class="hero">
        <h1>hey.<br>im eire.</h1>

        <a class="button" href="https://eireq.github.io/me">about me →</a>
    </section>
</main>

<footer>
    <strong>contact</strong><br><br>
    you can contact me via
    <a href="mailto:eireball@proton.me">email</a>.
    <br><br>
    © 2026 eire
</footer>

</body>
</html>
